<!DOCTYPE html>
<html>
<head>
<title>AI Chatbot</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f172a, #111827);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    color: white;
}

/* Container */
.chat-wrapper {
    width: 420px;
    height: 650px;
    background: rgba(255,255,255,0.06);
    border-radius: 18px;
    backdrop-filter: blur(15px);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
}

/* Header */
.header {
    padding: 15px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    background: rgba(255,255,255,0.05);
}

/* Chat area */
#chat {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
}

/* Messages */
p {
    margin: 8px 0;
    padding: 10px 12px;
    border-radius: 12px;
    max-width: 80%;
    word-wrap: break-word;
}

.user {
    background: #3b82f6;
    margin-left: auto;
    text-align: right;
}

.ai {
    background: #22c55e;
    margin-right: auto;
}

/* Input area */
.input-area {
    display: flex;
    padding: 10px;
    background: rgba(255,255,255,0.05);
}

input {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: none;
    outline: none;
}

button {
    margin-left: 8px;
    padding: 10px 14px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.2s;
}

.send {
    background: #6366f1;
    color: white;
}

.clear {
    background: #ef4444;
    color: white;
}

button:hover {
    transform: scale(1.05);
}
</style>
</head>

<body>

<div class="chat-wrapper">

    <div class="header">🤖 My AI Chatbot</div>

    <div id="chat"></div>

    <div class="input-area">
        <input id="msg" placeholder="Ask something...">
        <button class="send" id="sendBtn">Send</button>
        <button class="clear" onclick="clearChat()">Clear</button>
    </div>

</div>

<script>

async function clearChat(){
    document.getElementById("chat").innerHTML = "";

    await fetch("/clear", {
        method: "POST"
    });
}

document.getElementById("sendBtn").addEventListener("click", send);

async function send(){

    let input = document.getElementById("msg");
    let chat = document.getElementById("chat");
    let message = input.value;

    if(message.trim() === "") return;

    chat.innerHTML += `<p class="user"><b>You:</b> ${message}</p>`;
    input.value = "";

    chat.innerHTML += `<p class="ai" id="loading">AI is typing...</p>`;

    try {
        let response = await fetch("/chat", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({message: message})
        });

        let data = await response.json();

        document.getElementById("loading").remove();

        chat.innerHTML += `<p class="ai"><b>AI:</b> ${data.reply}</p>`;

        chat.scrollTop = chat.scrollHeight;

    } catch(error) {

        document.getElementById("loading").remove();

        chat.innerHTML += `<p class="ai"><b>Error:</b> ${error}</p>`;
    }
}

</script>

</body>
</html>
