<!DOCTYPE html>
<html>
<head>
<title>AI Chatbot</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: 'Inter', system-ui, sans-serif;
    background: #0f172a;
    color: #e5e7eb;
    height: 100vh;
    display: flex;
}

/* Layout */
.app {
    display: flex;
    width: 100%;
    height: 100vh;
}

/* Sidebar */
.sidebar {
    width: 260px;
    background: #0b1220;
    border-right: 1px solid rgba(255,255,255,0.08);
    display: flex;
    flex-direction: column;
    transition: 0.3s;
}

.sidebar-header {
    padding: 16px;
    font-weight: 600;
    font-size: 14px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
}

.new-chat {
    margin: 12px;
    padding: 10px;
    background: #111827;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    cursor: pointer;
    text-align: center;
}

.chat-history {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
}

.chat-item {
    padding: 10px;
    border-radius: 8px;
    font-size: 13px;
    color: #cbd5e1;
    cursor: pointer;
    margin-bottom: 6px;
}

.chat-item:hover {
    background: #1f2937;
}

/* Main */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
}

/* Top bar */
.topbar {
    padding: 14px 18px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    font-weight: 600;
    background: #0f172a;
    display: flex;
    align-items: center;
    gap: 10px;
}

.menu-btn {
    display: none;
    background: #111827;
    border: 1px solid rgba(255,255,255,0.1);
    color: white;
    padding: 6px 10px;
    border-radius: 8px;
    cursor: pointer;
}

/* Chat */
#chat {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

p {
    margin: 0;
    padding: 10px 14px;
    border-radius: 14px;
    max-width: 70%;
    word-wrap: break-word;
    line-height: 1.4;
    animation: fadeIn 0.2s ease-in-out;
    white-space: pre-wrap;
}

.user {
    background: #2563eb;
    color: white;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
}

.ai {
    background: #1f2937;
    color: #e5e7eb;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
}

/* Input */
.input-area {
    display: flex;
    padding: 14px;
    border-top: 1px solid rgba(255,255,255,0.08);
    background: #0f172a;
    align-items: center;
    gap: 10px;
}

input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.08);
    outline: none;
    background: #111827;
    color: white;
    font-size: 14px;
}

input:focus {
    border-color: #3b82f6;
}

button {
    padding: 10px 14px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

.send {
    background: #3b82f6;
    color: white;
}

.clear {
    background: #ef4444;
    color: white;
}

/* Animation */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
}

/* MOBILE */
@media (max-width: 768px) {

    body {
        flex-direction: column;
    }

    .app {
        flex-direction: column;
    }

    .sidebar {
        position: fixed;
        left: -260px;
        top: 0;
        height: 100%;
        z-index: 1000;
    }

    .sidebar.open {
        left: 0;
    }

    .menu-btn {
        display: inline-block;
    }

    #chat {
        padding: 12px;
    }

    p {
        max-width: 85%;
        font-size: 14px;
    }

    .input-area {
        padding: 10px;
    }

    input {
        font-size: 14px;
    }
}

</style>
</head>

<body>

<div class="app">

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">Chat History</div>
        <div class="new-chat">+ New Chat</div>
        <div class="chat-history">
            <div class="chat-item">Conversation 1</div>
            <div class="chat-item">Conversation 2</div>
        </div>
    </div>

    <!-- Main -->
    <div class="main">

        <div class="topbar">
            <button class="menu-btn" onclick="toggleSidebar()">☰</button>
            AI Assistant
        </div>

        <div id="chat"></div>

        <div class="input-area">
            <input id="msg" placeholder="Message...">
            <button class="send" id="sendBtn">Send</button>
            <button class="clear" onclick="clearChat()">Clear</button>
        </div>

    </div>

</div>

<script>

function toggleSidebar(){
    document.getElementById("sidebar").classList.toggle("open");
}

async function clearChat(){
    document.getElementById("chat").innerHTML = "";

    await fetch("/clear", {
        method: "POST"
    });
}

document.getElementById("sendBtn").addEventListener("click", send);

async function send(){

    let input = document.getElementById("msg");
    let chat = document.getElementById("chat");
    let message = input.value;

    if(message.trim() === "") return;

    chat.innerHTML += `<p class="user"><b>You:</b> ${message}</p>`;
    input.value = "";

    chat.innerHTML += `<p class="ai"><b>AI:</b> ${"AI is typing..."}</p>`;
    chat.scrollTop = chat.scrollHeight;

    try {
        let response = await fetch("/chat", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({message: message})
        });

        let data = await response.json();

        // remove last typing
        let msgs = chat.querySelectorAll(".ai");
        msgs[msgs.length - 1].remove();

        chat.innerHTML += `<p class="ai"><b>AI:</b> ${data.reply.replace(/\n/g, "<br>")}</p>`;
        chat.scrollTop = chat.scrollHeight;

    } catch(error) {

        let msgs = chat.querySelectorAll(".ai");
        msgs[msgs.length - 1].remove();

        chat.innerHTML += `<p class="ai"><b>Error:</b> ${error.toString().replace(/\n/g, "<br>")}</p>`;
    }
}

</script>

</body>
</html>
